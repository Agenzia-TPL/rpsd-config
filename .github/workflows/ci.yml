name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/agenzia-tpl/rpsd-config

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agenzia-tpl/rpsd-config-ci:latest

    steps:
      - name: Check out rpsd-config
        uses: actions/checkout@v4
        with:
          path: rpsd-config

      - name: Check out rpsd-commons
        uses: actions/checkout@v4
        with:
          repository: Agenzia-TPL/rpsd-commons
          path: rpsd-commons

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: rpsd-config
        run: uv sync --dev

      - name: Lint
        working-directory: rpsd-config
        run: uv run ruff check .

      - name: Test
        working-directory: rpsd-config
        # Exit code 5 = no tests collected — acceptable while the test suite is being built.
        # The || pattern is used instead of capturing $? because GitHub Actions runs bash
        # with -e (exit on error), which would cause the shell to exit before $? is read.
        run: uv run pytest -m "not integration" || [ $? -eq 5 ]

  secrets-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out rpsd-config
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR diff for verified secrets
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@6c64db94d5b2e09d7e0948fb6bd3166cc6fffbc7  # v3.94.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Scan push for verified secrets
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@6c64db94d5b2e09d7e0948fb6bd3166cc6fffbc7  # v3.94.0
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agenzia-tpl/rpsd-config-ci:latest
    permissions:
      contents: read

    steps:
      - name: Check out rpsd-config
        uses: actions/checkout@v4
        with:
          path: rpsd-config

      - name: Check out rpsd-commons
        uses: actions/checkout@v4
        with:
          repository: Agenzia-TPL/rpsd-commons
          path: rpsd-commons

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: rpsd-config
        run: uv sync --dev

      - name: Check dependency licenses
        working-directory: rpsd-config
        run: |
          uv run pip-licenses \
            --from=mixed \
            --partial-match \
            --allow-only="\
          MIT;\
          BSD;\
          Apache;\
          ISC;\
          PSF;\
          Python Software Foundation;\
          Python-2.0;\
          Unlicense;\
          Public Domain;\
          CC0;\
          Artistic;\
          Zlib;\
          CNRI;\
          WTFPL;\
          Boost;\
          BSL;\
          Historical Permission Notice;\
          HPND;\
          X11;\
          0BSD;\
          SIL Open Font;\
          MPL;\
          Mozilla Public License;\
          LGPL;\
          LPGL;\
          Lesser General Public License;\
          EPL;\
          Eclipse Public License;\
          EUPL;\
          European Union Public License;\
          CeCILL;\
          CeCILL-B;\
          CeCILL-C;\
          GPL;\
          GNU General Public License;\
          AGPL;\
          GNU Affero General Public License"

  spdx-check:
    name: SPDX Headers
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out rpsd-config
        uses: actions/checkout@v4

      - name: Check SPDX headers
        run: |
          bash ai-skills/open-source-it-pa/scripts/check_headers.sh \
            --check --ext py src/

  build-and-push:
    name: Build & Push
    needs: [test, secrets-scan, license-check, spdx-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out rpsd-config
        uses: actions/checkout@v4
        with:
          path: rpsd-config

      - name: Check out rpsd-commons
        uses: actions/checkout@v4
        with:
          repository: Agenzia-TPL/rpsd-commons
          path: rpsd-commons

      - name: Read version
        id: version
        working-directory: rpsd-config
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./rpsd-config
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
