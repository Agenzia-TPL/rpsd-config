name: Secret Audit (one-time)

on:
  workflow_dispatch:

jobs:
  full-scan:
    name: TruffleHog Full History Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full repository history
        uses: trufflesecurity/trufflehog@6c64db94d5b2e09d7e0948fb6bd3166cc6fffbc7  # v3.94.0
        with:
          path: ./
          extra_args: --only-verified
