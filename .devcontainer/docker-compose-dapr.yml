services:
  ############################
  # Dapr placement service
  ############################
  placement:
    image: "daprio/dapr"
    command: ["./placement", "-port", "50006"]
    networks:
      - rpsd-dapr

  ############################
  # Dapr scheduler service
  ############################
  scheduler:
    image: "daprio/dapr"
    command: ["./scheduler", "--port", "50007", "--etcd-data-dir", "/data"]
    networks:
      - rpsd-dapr
    user: root
    volumes:
      - "../mnt/dapr-etcd-data/:/data"

  ############################
  # Redis state store
  ############################
  redis:
    image: "redis:alpine"
    networks:
      - rpsd-dapr

############################
# Network between containers
############################
networks:
  rpsd-dapr:
    external: true
    name: rpsd-dapr

