############################
# Dapr platform
############################
include:
  - ./docker-compose-dapr.yml
  - ./docker-compose-database.yml

services:
  rpsd-config:
    extends:
      file: ./docker-compose-base.yml
      service: rpsd-config
    depends_on:
      - postgis
      
  ############################
  # Dapr sidecar
  ############################
  rpsd-config-dapr:
    extends:
      file: ./docker-compose-base.yml
      service: rpsd-config-dapr
    depends_on:
      - placement
      - scheduler
      - redis
    ports:
      - "12080:8000"
