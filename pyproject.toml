[project]
name = "rpsd-config"
version = "0.3.0"
description = "Config service of the Rapsodia platform"
readme = "README.md"
authors = [
    { name = "Agenzia TPL" }
]
license = "EUPL-1.2"
requires-python = ">=3.13"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["django", "web", "framework"]

dependencies = [
    "django[gis]>=5.2.0",  # ---> rimuovo "django>=5.2.0",
    "psycopg[binary]>=3.1.0",    # Environment variables
    "pillow>=10.0.0",          # Image processing
    "pydantic-settings>=2.12.0",
    "django-extensions>=3.2.0", # Useful Django extensions
    "django-leaflet>=0.29.0",   # Leaflet maps integration
    "requests>=2.32",
    # "djangorestframework>=3.15.0", # REST API framework
    # "djangorestframework-simplejwt>=5.0.0", # JWT authentication
    # "drf-spectacular>=1.7.0",  # OpenAPI schema generation
    # "django-cors-headers>=4.0.0", # CORS handling
    # "django-filter>=23.0.0",   # Filtering support for DRF
    # "celery>=5.4.0",           # Asynchronous task queue
    # "redis>=5.0.0",            # Redis client for Celery
    # "flower>=1.0.0",           # Celery monitoring tool
    "uvicorn>=0.23.0",         # ASGI server
    "gunicorn>=21.0.0",        # WSGI/ASGI process manager
    # "whitenoise>=6.4.0",      # Static file serving
    # "psutil>=5.9.0",          # System and process utilities
    "django-allauth>=0.56.0",
    "pyjwt>=2.8",
    "cryptography>=41.0",
    "django-ninja>=1.5.3",
]

[tool.uv.sources]
# Example: pin to specific git commit or branch if needed
# django = { git = "https://github.com/django/django.git", branch = "main" }

[project.scripts]
manage = "rpsd_config.manage:main"
devserver = "rpsd_config.manage:devserver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",    # Parallel test execution
    "factory-boy>=3.3.0",
    "django-debug-toolbar>=4.2.0",
    "pip-licenses>=5.5.1",
]

[tool.ruff]
target-version = "py313"
src = ["packages/*/src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"packages/*/examples/*" = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest configuration
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rpsd_config.server.settings"
addopts = [
    "--reuse-db",
    "--cov=rpsd_config",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--strict-markers",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]
